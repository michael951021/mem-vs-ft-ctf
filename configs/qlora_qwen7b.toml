# QLoRA config for arms E/F. Base = Qwen2.5-7B-Instruct (fits one 3090 in 4-bit).
# Chosen as the single frozen 7-14B base for a matched H3 (DECISIONS D4-final):
# the staged GPU job re-runs A-D on this same base before QLoRA-ing it here.
[model]
name = "qwen2.5-7b-instruct"          # Ollama tag used for A-D eval of this base
hf_name = "Qwen/Qwen2.5-7B-Instruct"  # HF safetensors for QLoRA training
approx_params_b = 7.6

[lora]
r = 16
alpha = 32
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[train]
epochs = 3
batch_size = 1
grad_accum = 8
lr = 2e-4
seq_len = 1024
